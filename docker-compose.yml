services:
  bot:
    build: .
    image: discord-games-bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
      TRUST_PROXY: "true"
    volumes:
      - bot-data:/data
    # Only reachable from this machine; Caddy (or your existing proxy) handles the public side.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Automatic HTTPS. Skip it (`docker compose up -d bot`) if the server already
  # runs a reverse proxy on ports 80/443, and point that proxy at 127.0.0.1:3000.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [bot]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
  caddy-data:
  caddy-config:
